[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lattice"
dynamic = ["version"]
description = "Local-first conversational lattice harness"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.152",
    "fastapi>=0.115,<2.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "pydantic>=2.8,<3.0",
    "rfc8785==0.1.4",
    "starlette>=0.40,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
lattice = "lattice.cli:main"

[tool.uv]
# Keep the separately qualified, subscription-authenticated CLI as the runtime.
# The SDK's platform wheel bundles another CLI; only its Python layer is needed.
no-binary-package = ["claude-agent-sdk"]

[tool.hatch.version]
path = "lattice/__about__.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: compares behavior with an independent source of truth",
    "property: checks an invariant over a class of inputs",
    "regression: detects drift without independently proving correctness",
    "contract: checks an interface or state-transition contract",
    "smoke: checks liveness without claiming correctness",
    "fuzz: malformed or adversarial input robustness",
    "concurrency: lease and interleaving assurance",
    "authenticated: invokes a real subscription-authenticated provider CLI",
]

[tool.hatch.build.targets.wheel]
packages = ["lattice"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "lattice/web_dist"
"workflow_packs" = "lattice/workflow_packs"
